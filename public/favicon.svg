<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --left-stroke: #171717;
      --dot-color: #0070f3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --left-stroke: #ffffff;
        --dot-color: #00dfd8;
      }
    }
    .left-wing {
      stroke: var(--left-stroke);
    }
    .right-wing {
      stroke: #0070f3;
    }
    .apex-dot {
      fill: var(--dot-color);
    }
  </style>
  <!-- Left Wing (Adaptive Black in light, White in dark) -->
  <path class="left-wing" d="M4 8.5L10 24L16 13.5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Wing (Signature Electric Blue) -->
  <path class="right-wing" d="M16 13.5L22 24L28 8.5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Apex Pulse Dot -->
  <circle class="apex-dot" cx="28" cy="8.5" r="2.2"/>
</svg>
