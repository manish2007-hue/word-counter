<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Word Counter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <span class="dot"></span>
        <span class="brand-name">Clean<strong>WordCounter</strong></span>
      </div>
      <a href="https://cleanwordcounter.com" target="_blank" class="full-tool-link" title="Open full website">
        Web App ↗
      </a>
    </header>

    <div class="editor-wrap">
      <textarea id="text-input" placeholder="Type or paste your text here..." autofocus></textarea>
    </div>

    <div class="stats-grid">
      <div class="stat-card primary">
        <span class="stat-label">Words</span>
        <span id="stat-words" class="stat-val">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Characters</span>
        <span id="stat-chars" class="stat-val">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">No Spaces</span>
        <span id="stat-chars-no-spaces" class="stat-val">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Sentences</span>
        <span id="stat-sentences" class="stat-val">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Reading Time</span>
        <span id="stat-read" class="stat-val">0s</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Speaking Time</span>
        <span id="stat-speak" class="stat-val">0s</span>
      </div>
    </div>

    <div class="actions">
      <button id="btn-clean" class="btn" title="Remove double spaces and extra line breaks">Clean Text</button>
      <button id="btn-copy" class="btn">Copy</button>
      <button id="btn-clear" class="btn btn-danger">Clear</button>
    </div>

    <footer class="footer">
      <span>100% Private &amp; In-Browser • Zero Ads</span>
      <a href="https://cleanwordcounter.com/words-to-pages" target="_blank">Words to Pages</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
